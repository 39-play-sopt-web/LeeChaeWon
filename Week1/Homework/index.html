<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/theme.css">
        <link rel="stylesheet" href="css/styles.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <title>PLAY SOTP 1주차 과제</title>
    </head>
    <body>
        <!--헤더 영역-->
        <header class="header">
            <img src="./images/header/header-profile.svg" alt="헤더 프로필 사진" class="header__profile">
            <h1 class="header__title">채원이의 블로그</h1>
            <a href="https://github.com/chaewon41" class="header__social">
                <i class="fa-brands fa-github"></i>
            </a>
        </header>

        <div class="layout">
            <!--사이드바 영역-->
            <nav class="sidebar">
                <ul>
                    <li><a href="#photo-dump">포토덤프</a></li>
                    <li><a href="#likes">좋아하는 것</a></li>
                    <li><a href="#interests">내 관심사</a></li>
                    <li><a href="#messages">To.웹토리</a></li>
                </ul>
            </nav>

            <!--메인 컨텐츠 영역-->
            <main>
                <section id="photo-dump">
                    <h2>포토 덤프</h2>
                    <div class="photo-dump__grid">
                        <div class="photo-dump__item photo-dump__item--a">
                            <img src="./images/photo-dump/photo-dump-01.png" alt="몽마르트 언덕">
                        </div>

                        <div class="photo-dump__item photo-dump__item--b">
                            <img src="./images/photo-dump/photo-dump-02.png" alt="젤라또">
                        </div>

                        <div class="photo-dump__item photo-dump__item--c">
                            <img src="./images/photo-dump/photo-dump-03.png" alt="베르사유 궁전">
                        </div>

                        <div class="photo-dump__item photo-dump__item--d">
                            <img src="./images/photo-dump/photo-dump-04.png" alt="스위스에서 찍은 사진">
                        </div>

                        <div class="photo-dump__item photo-dump__item--e">
                            <img src="./images/photo-dump/photo-dump-05.png" alt="뤽상부르 공원">
                        </div>

                        <div class="photo-dump__item photo-dump__item--f">
                            <img src="./images/photo-dump/photo-dump-06.png" alt="체스키 크룸로프">
                        </div>

                    </div>

                </section>
            </main>


        </div>

        <footer></footer>
    </body>
</html>
